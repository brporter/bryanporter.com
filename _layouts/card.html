<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/card.css' | relative_url }}">
</head>
<body>
    {{ content }}

    <!-- NES Emulator Modal -->
    <div id="emulator-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeEmulator()">&times;</span>
            <h2>🎮 Easter Egg Found!</h2>
            <canvas id="nes-canvas" width="256" height="240"></canvas>
            <div class="emulator-controls">
                <p>Controls: Arrow Keys = D-Pad, Z = A, X = B, Enter = Start, Shift = Select</p>
            </div>
        </div>
    </div>

    <!-- FreeBSD v86 Emulator Modal -->
    <div id="v86-modal" class="modal v86-fullscreen-modal">
        <div class="v86-container">
            <div class="v86-header">
                <div class="v86-title">
                    <span class="v86-icon">🐡</span>
                    <h2>FreeBSD Emulator</h2>
                </div>
                <button class="v86-close-btn" onclick="closeV86()" aria-label="Close emulator">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="v86-frame-wrapper">
                <iframe id="v86-frame" title="FreeBSD v86 Emulator"></iframe>
            </div>
            <div class="v86-footer">
                <p>🎉 You found the secret FreeBSD emulator! Use your keyboard to interact with the system.</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/jsnes@1.2.1/dist/jsnes.min.js"></script>
    <script src="{{ '/assets/js/easter-egg.js' | relative_url }}"></script>
</body>
</html>
